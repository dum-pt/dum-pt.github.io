<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">

<title>Powder room</title>
<style>
  :root {
    --ink: #f4efe7;
    --muted: rgba(244, 239, 231, 0.62);
    --panel: rgba(24, 20, 17, 0.56);
    --line: rgba(255, 255, 255, 0.12);
    --accent: #c9a37c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #15110e; color: var(--ink);
    font: 13px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
  #app { position: fixed; inset: 0; }
  #app canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  .panel { background: var(--panel); backdrop-filter: blur(16px) saturate(1.25); -webkit-backdrop-filter: blur(16px) saturate(1.25);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25); }
  #title { position: fixed; left: 16px; top: 16px; padding: 13px 16px 12px; max-width: 300px; }
  #title h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: 0.2px; }
  #title p { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
  button { font: inherit; color: var(--ink); background: transparent; border: 0; border-radius: 9px; padding: 7px 11px; cursor: pointer; white-space: nowrap; }
  button:hover { background: rgba(255, 255, 255, 0.08); }
  button.on { background: rgba(255, 255, 255, 0.17); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  #views { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 3px; padding: 5px; max-width: calc(100vw - 32px); overflow-x: auto; scrollbar-width: none; }
  #views button kbd { font: 10px ui-monospace, monospace; color: var(--muted); margin-left: 6px; }
  #side { position: fixed; right: 16px; top: 16px; width: 252px; padding: 12px; display: flex; flex-direction: column; gap: 13px; }
  .group h2 { margin: 0 0 6px; font-size: 10.5px; font-weight: 600; letter-spacing: 0.9px; text-transform: uppercase; color: var(--muted); }
  .seg { display: flex; gap: 3px; background: rgba(0, 0, 0, 0.2); padding: 3px; border-radius: 10px; }
  .seg button { flex: 1; padding: 6px 4px; font-size: 12px; }
  #vanities { display: grid; grid-template-columns: 1fr 1fr; }
  #vanities button:last-child { grid-column: span 2; }
  #vanity-flip { margin-top: 7px; }
  .winrow { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  .winrow .seg { flex: 1; }
  .winrow > span:first-child { min-width: 44px; }
  .winrow input[type=range] { flex: 1; min-width: 0; accent-color: var(--accent); }
  #side { max-height: calc(100vh - 32px); overflow-y: auto; scrollbar-width: thin; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  #sunrow { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
  #sunrow[hidden] { display: none; }
  #sunrow input { flex: 1; min-width: 0; accent-color: var(--accent); }
  #sunlabel { color: var(--ink); font-variant-numeric: tabular-nums; width: 38px; text-align: right; }
  .chip { border: 1px solid var(--line); padding: 5px 10px; font-size: 12px; border-radius: 20px; }
  .chip.on { background: rgba(201, 163, 124, 0.22); border-color: rgba(201, 163, 124, 0.6); }
  #legend { list-style: none; margin: 0; padding: 0; font-size: 11.5px; color: var(--muted); }
  #legend li { display: flex; gap: 8px; align-items: baseline; padding: 2px 0; }
  #legend i { width: 9px; height: 9px; border-radius: 3px; flex: none; transform: translateY(1px); border: 1px solid rgba(255, 255, 255, 0.18); }
  #legend b { color: var(--ink); font-weight: 500; }
  #hint { position: fixed; left: 16px; bottom: 22px; color: var(--muted); font-size: 11.5px; pointer-events: none; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #15110e; z-index: 10; transition: opacity 0.7s; }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading .box { text-align: center; }
  #loading .ring { width: 34px; height: 34px; margin: 0 auto 14px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.12); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  #status { color: var(--muted); font-size: 12.5px; }
  #busy { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); padding: 7px 12px; font-size: 12px; color: var(--muted); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  #busy.show { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #opts { display: none; }
  @media (max-width: 1500px) { #hint { bottom: 74px; } }   /* clear of the view bar */
  @media (max-width: 760px) {
    #title { left: 12px; top: 12px; padding: 10px 12px; }
    #title p, #legend, #legend-h, #hint { display: none; }
    #opts { display: block; position: fixed; right: 12px; top: 12px; padding: 9px 13px; }
    #side { top: 58px; right: 12px; left: auto; width: min(280px, calc(100vw - 24px)); padding: 10px; gap: 9px; display: none; }
    #side.open { display: flex; }
    #views { bottom: 12px; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RectAreaLightUniformsLib } from 'three/addons/lights/RectAreaLightUniformsLib.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { Sky } from 'three/addons/objects/Sky.js';

const $ = (id) => document.getElementById(id);
const setStatus = (t) => { $('status').textContent = t; };
const pause = () => new Promise((r) => setTimeout(r, 16));

// SketchUp coordinates (metres, z up) -> three.js world (y up)
const SU = (x, y, z = 0) => new THREE.Vector3(x, z, -y);

// ---------------------------------------------------------------- room, measured from the house model
// The windowless powder room on the upper floor, between the two flights of the stairs, in the coordinates of the
// house model ('Projekt Rozp model.skp') with its floor at 0: the door from the corridor in the middle of the
// south wall, the Street basin across the west end under a full-width mirror, the WC on a pre-wall at the east end.
const X0 = 53.825, X1 = 55.945;        // west (basin) / east (WC) wall faces
const Y0 = 14.645, Y1 = 15.63;         // south (door) / north wall faces
const XW0 = 53.685, XW1 = 56.085;      // outer faces of the west and east walls
const YW0 = 14.545, YW1 = 15.73;       // outer faces of the south and north walls
const H = 2.6;                         // ceiling
const WT = 2.72;                       // wall top (section height)
const YC = (Y0 + Y1) / 2;              // the room's centre line
const DOOR_S = [54.345, 55.145], DOOR_H = 2.15;                   // door from the corridor (hinge on the basin side)
// the antoniolupi Street basin as drawn in the model: front lip (fx..), backsplash (..bx), raised side tops ending at
// side[0] / side[1], top heights, the sunk basin floor, the drawer under it
const ST = { front: 54.225, splash: X0 + 0.02, side: [14.885, 15.395], top: 0.77, floor: 0.65, lip: 0.85, z0: 0.6, back: 1.1, drawer: [0.345, 0.595] };
const MIRROR = { y0: Y0, y1: Y1, z0: 1.11, x: ST.splash };        // full-width mirror from the backsplash to the ceiling (x = its face)
const WC = { front: 55.745, top: 1.15 };                           // the WC pre-wall: its face and height (its top is a ledge)
const ART = { y0: YC - 0.3, y1: YC + 0.3, z0: 1.36, z1: 2.16 };     // the framed print on the wall above the WC
const CANDLES = [[(WC.front + X1) / 2, 15.47, WC.top + 0.07], [54.05, 15.52, ST.top + 0.059]];   // the wicks
const NICHE_LEDS = [];
const COVE_Y = Y1;
// (no window: these only feed the shared daylight code, which stays dark here)
const DOOR_N = [54.5, 54.6], WIN_TOP = H, WIN = { x0: 54.5, x1: 54.6, z0: 1, z1: 1.1, y: YW1 }, SASH = {};
const BLIND = { x0: 54.5, x1: 54.6, y: YW1 + 0.1, head: 2, sill: 1.9 };

// ---------------------------------------------------------------- renderer
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
$('app').appendChild(renderer.domElement);
RectAreaLightUniformsLib.init();
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e0b09);
const R = new THREE.Group();           // everything below lives in SketchUp coordinates
R.rotation.x = -Math.PI / 2;
scene.add(R);
const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.02, 5000);

// ---------------------------------------------------------------- shader patches
// 1) box-projected environment reflections: the env cube is captured inside this room, so
//    reflections are corrected against the room box instead of being treated as infinitely far.
// 2) planar reflections: surfaces flagged PLANAR take their specular radiance from a mirrored render.
const BP = {
  bpMin: { value: new THREE.Vector3(X0, 0, -Y1) },
  bpMax: { value: new THREE.Vector3(X1, H, -Y0) },
  bpProbe: { value: SU(54.9, 15.14, 1.3) },
  bpOn: { value: 1 },
};
const lightsMapsPatched = THREE.ShaderChunk.lights_fragment_maps
  .replace('radiance += getIBLRadiance( geometryViewDir, geometryNormal, material.roughness );', `
    #ifdef PLANAR
      {
        vec2 puv = vPlanarUv.xy / vPlanarUv.w + ( geometryNormal.xy - nonPerturbedNormal.xy ) * planarDistort;
        vec3 envR = getIBLRadiance( geometryViewDir, geometryNormal, material.roughness );
        radiance += mix( envR, textureLod( planarTex, puv, material.roughness * planarLod ).rgb, planarOn );
      }
    #else
      radiance += getIBLRadiance( geometryViewDir, geometryNormal, material.roughness );
    #endif`)
  .replace('clearcoatRadiance += getIBLRadiance( geometryViewDir, geometryClearcoatNormal, material.clearcoatRoughness );', `
    #ifdef PLANAR
      {
        vec2 cuv = vPlanarUv.xy / vPlanarUv.w;
        vec3 envC = getIBLRadiance( geometryViewDir, geometryClearcoatNormal, material.clearcoatRoughness );
        clearcoatRadiance += mix( envC, textureLod( planarTex, cuv, material.clearcoatRoughness * planarLod ).rgb, planarOn );
      }
    #else
      clearcoatRadiance += getIBLRadiance( geometryViewDir, geometryClearcoatNormal, material.clearcoatRoughness );
    #endif`);
const envParsPatched = THREE.ShaderChunk.envmap_physical_pars_fragment.replace(
  'reflectVec = inverseTransformDirection( reflectVec, viewMatrix );',
  'reflectVec = boxProject( inverseTransformDirection( reflectVec, viewMatrix ) );');

function patchShader(shader) {
  // called as material.onBeforeCompile, so `this` is the material
  Object.assign(shader.uniforms, BP);
  const pl = this.userData.planar;
  if (pl) Object.assign(shader.uniforms, pl.uniforms);
  shader.vertexShader = shader.vertexShader
    .replace('#include <common>', `#include <common>
      varying vec3 vWPos;
      #ifdef PLANAR
        uniform mat4 planarMatrix;
        varying vec4 vPlanarUv;
      #endif`)
    .replace('#include <worldpos_vertex>', `#include <worldpos_vertex>
      vWPos = ( modelMatrix * vec4( transformed, 1.0 ) ).xyz;
      #ifdef PLANAR
        vPlanarUv = planarMatrix * vec4( vWPos, 1.0 );
      #endif`);
  shader.fragmentShader = shader.fragmentShader
    .replace('#include <common>', `#include <common>
      varying vec3 vWPos;
      uniform vec3 bpMin;
      uniform vec3 bpMax;
      uniform vec3 bpProbe;
      uniform float bpOn;
      vec3 boxProject( vec3 dir ) {
        if ( bpOn < 0.5 ) return dir;
        vec3 tA = ( bpMax - vWPos ) / dir;
        vec3 tB = ( bpMin - vWPos ) / dir;
        vec3 tF = max( tA, tB );
        float t = max( min( min( tF.x, tF.y ), tF.z ), 0.0 );
        return normalize( vWPos + dir * t - bpProbe );
      }
      #ifdef PLANAR
        uniform sampler2D planarTex;
        uniform float planarOn;
        uniform float planarLod;
        uniform float planarDistort;
        varying vec4 vPlanarUv;
      #endif`)
    .replace('#include <envmap_physical_pars_fragment>', envParsPatched)
    .replace('#include <lights_fragment_maps>', lightsMapsPatched + `
      #ifdef OUTDOOR
        iblIrradiance = vec3( 0.0 );      // the env cube holds the room's light, not the sky's
        radiance = vec3( 0.0 );
        #ifdef USE_CLEARCOAT
          clearcoatRadiance = vec3( 0.0 );
        #endif
      #endif`)
    .replace('#include <lights_fragment_begin>', outdoorLights)
    .replace('#include <aomap_fragment>', `
      #ifdef NO_DIRECT_SPEC
        reflectedLight.directSpecular = vec3( 0.0 );   // the planar reflection already shows the light sources
      #else
        // analytic highlights stay below the bloom threshold; only the sun disc itself and its
        // mirror images flare
        reflectedLight.directSpecular = min( reflectedLight.directSpecular, vec3( 25.0 ) );
        #ifdef USE_CLEARCOAT
          clearcoatSpecularDirect = min( clearcoatSpecularDirect, vec3( 25.0 ) );
        #endif
      #endif
      #include <aomap_fragment>`)
    .replace('#include <opaque_fragment>', `#include <opaque_fragment>
      gl_FragColor.rgb = min( gl_FragColor.rgb, vec3( 4000.0 ) );   // keep sun glints inside half-float range`);
}

// OUTDOOR surfaces take only the lights that can really reach them: the sun (not its bounce off the mirror,
// directional light 1, which only lights the room) and the shadowed downlights shining out through the window.
// The point and area lights cast no shadows, so they would shine through the walls; the env cube (captured in
// the room) is left out too (see patchShader).
const outdoorLights = THREE.ShaderChunk.lights_fragment_begin
  .replace('getDirectionalLightInfo( directionalLight, directLight );', `getDirectionalLightInfo( directionalLight, directLight );
    #ifdef OUTDOOR
      if ( UNROLLED_LOOP_INDEX == 1 ) directLight.color = vec3( 0.0 );
    #endif`)
  .replace('getPointLightInfo( pointLight, geometryPosition, directLight );', `getPointLightInfo( pointLight, geometryPosition, directLight );
    #ifdef OUTDOOR
      directLight.color = vec3( 0.0 );
    #endif`)
  .replace('rectAreaLight = rectAreaLights[ i ];', `rectAreaLight = rectAreaLights[ i ];
    #ifdef OUTDOOR
      rectAreaLight.color = vec3( 0.0 );
    #endif`);
function physical(params = {}, planar = null) {
  const m = new THREE.MeshPhysicalMaterial(params);
  if (planar) { m.userData.planar = planar; m.defines = { PLANAR: '' }; }
  m.onBeforeCompile = patchShader;
  return m;
}

// ---------------------------------------------------------------- planar reflections
class Planar {
  constructor(normal, point, { scale = 1, lod = 0, distort = 0 } = {}) {
    this.n = normal.clone().normalize();
    this.p = point.clone();
    this.scale = scale;
    this.cam = new THREE.PerspectiveCamera();
    this.rt = new THREE.WebGLRenderTarget(4, 4, {
      type: THREE.HalfFloatType, samples: 4,
      generateMipmaps: lod > 0, minFilter: lod > 0 ? THREE.LinearMipmapLinearFilter : THREE.LinearFilter,
    });
    this.uniforms = {
      planarTex: { value: this.rt.texture },
      planarMatrix: { value: new THREE.Matrix4() },
      planarOn: { value: 0 },
      planarLod: { value: lod },
      planarDistort: { value: distort },
    };
    this.meshes = [];
    this._v = [new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
    this._plane = new THREE.Plane();
    this._clip = new THREE.Vector4();
    this._q = new THREE.Vector4();
  }
  setSize(w, h) { this.rt.setSize(Math.max(2, Math.round(w * this.scale)), Math.max(2, Math.round(h * this.scale))); }
  // Renders the scene mirrored in this plane. `others` are reflectors that fall back to the env map meanwhile.
  update(renderer, scene, camera, others) {
    const [pos, fwd, up, tgt] = this._v;
    camera.getWorldPosition(pos);
    const side = pos.clone().sub(this.p).dot(this.n);
    if (side <= 0.001) return;
    const reflectPoint = (v) => v.sub(this.n.clone().multiplyScalar(2 * v.clone().sub(this.p).dot(this.n)));
    const reflectDir = (v) => v.sub(this.n.clone().multiplyScalar(2 * v.dot(this.n)));
    camera.getWorldDirection(fwd);
    up.set(0, 1, 0).applyQuaternion(camera.getWorldQuaternion(new THREE.Quaternion()));
    tgt.copy(pos).add(fwd);
    const cam = this.cam;
    cam.position.copy(reflectPoint(pos.clone()));
    cam.up.copy(reflectDir(up.clone()));
    cam.lookAt(reflectPoint(tgt.clone()));
    cam.near = camera.near; cam.far = camera.far;
    cam.updateMatrixWorld();
    cam.projectionMatrix.copy(camera.projectionMatrix);
    this.uniforms.planarMatrix.value.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1)
      .multiply(cam.projectionMatrix).multiply(cam.matrixWorldInverse);
    // oblique near plane = the reflector plane (Lengyel), so nothing behind the mirror leaks in
    this._plane.setFromNormalAndCoplanarPoint(this.n, this.p).applyMatrix4(cam.matrixWorldInverse);
    const c = this._clip.set(this._plane.normal.x, this._plane.normal.y, this._plane.normal.z, this._plane.constant);
    const pm = cam.projectionMatrix.elements, q = this._q;
    q.x = (Math.sign(c.x) + pm[8]) / pm[0];
    q.y = (Math.sign(c.y) + pm[9]) / pm[5];
    q.z = -1.0;
    q.w = (1.0 + pm[10]) / pm[14];
    c.multiplyScalar(2.0 / c.dot(q));
    pm[2] = c.x; pm[6] = c.y; pm[10] = c.z + 1.0; pm[14] = c.w;
    cam.projectionMatrixInverse.copy(cam.projectionMatrix).invert();

    for (const m of this.meshes) m.visible = false;
    const saved = others.map((o) => o.uniforms.planarOn.value);
    for (const o of others) o.uniforms.planarOn.value = 0;
    const prev = renderer.getRenderTarget();
    renderer.setRenderTarget(this.rt);
    renderer.clear();
    renderer.render(scene, cam);
    renderer.setRenderTarget(prev);
    others.forEach((o, i) => { o.uniforms.planarOn.value = saved[i]; });
    for (const m of this.meshes) m.visible = true;
  }

// ---------------------------------------------------------------- procedural textures (baked on the GPU)
const NOISE = /* glsl */`
  vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
  vec4 permute(vec4 x) { return mod289(((x * 34.0) + 10.0) * x); }
  vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
  float snoise(vec3 v) {
    const vec2 C = vec2(1.0 / 6.0, 1.0 / 3.0);
    const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
    vec3 i = floor(v + dot(v, C.yyy));
    vec3 x0 = v - i + dot(i, C.xxx);
    vec3 g = step(x0.yzx, x0.xyz);
    vec3 l = 1.0 - g;
    vec3 i1 = min(g.xyz, l.zxy);
    vec3 i2 = max(g.xyz, l.zxy);
    vec3 x1 = x0 - i1 + C.xxx;
    vec3 x2 = x0 - i2 + C.yyy;
    vec3 x3 = x0 - D.yyy;
    i = mod289(i);
    vec4 p = permute(permute(permute(i.z + vec4(0.0, i1.z, i2.z, 1.0)) + i.y + vec4(0.0, i1.y, i2.y, 1.0)) + i.x + vec4(0.0, i1.x, i2.x, 1.0));
    float n_ = 0.142857142857;
    vec3 ns = n_ * D.wyz - D.xzx;
    vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
    vec4 x_ = floor(j * ns.z);
    vec4 y_ = floor(j - 7.0 * x_);
    vec4 x = x_ * ns.x + ns.yyyy;
    vec4 y = y_ * ns.x + ns.yyyy;
    vec4 h = 1.0 - abs(x) - abs(y);
    vec4 b0 = vec4(x.xy, y.xy);
    vec4 b1 = vec4(x.zw, y.zw);
    vec4 s0 = floor(b0) * 2.0 + 1.0;
    vec4 s1 = floor(b1) * 2.0 + 1.0;
    vec4 sh = -step(h, vec4(0.0));
    vec4 a0 = b0.xzyw + s0.xzyw * sh.xxyy;
    vec4 a1 = b1.xzyw + s1.xzyw * sh.zzww;
    vec3 p0 = vec3(a0.xy, h.x);
    vec3 p1 = vec3(a0.zw, h.y);
    vec3 p2 = vec3(a1.xy, h.z);
    vec3 p3 = vec3(a1.zw, h.w);
    vec4 norm = taylorInvSqrt(vec4(dot(p0, p0), dot(p1, p1), dot(p2, p2), dot(p3, p3)));
    p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
    vec4 m = max(0.5 - vec4(dot(x0, x0), dot(x1, x1), dot(x2, x2), dot(x3, x3)), 0.0);
    m = m * m;
    return 105.0 * dot(m * m, vec4(dot(p0, x0), dot(p1, x1), dot(p2, x2), dot(p3, x3)));
  }
  float fbm(vec3 p, int oct) {
    float a = 0.5, s = 0.0;
    for (int i = 0; i < 8; i++) {
      if (i >= oct) break;
      s += a * snoise(p);
      p = p * 2.03 + vec3(17.1, 3.7, 9.2);
      a *= 0.5;
    }
    return s;
  }
  mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
`;

const BAKE_FRAG = /* glsl */`
  varying vec2 vUv;
  uniform vec2 uSize;
  uniform vec2 uTexel;
  uniform float uSeed;
  uniform vec3 uBase, uBase2, uVein, uVein2, uFine, uGrout;
  uniform float uScale, uWarp, uVeinW, uVeinAmt, uFineAmt, uCloud, uAngle, uStretch, uHalo, uBand, uStria;
  uniform float uRough, uRoughVar, uFlute;
  uniform vec2 uTile;
  uniform float uJoint;
  ${NOISE}

  void sampleMat(vec2 p, float seed, out vec3 col, out float h, out float r) {
  #if KIND == 0
    // veined marble. Veins are the zero lines of warped fractal fields; dividing the field by its
    // gradient gives the true distance (in metres) to the line, so vein widths are physical and crisp.
    float px = uTexel.x;
    float aa = px * 0.8;
    vec2 d = rot(uAngle) * p;
    d.x *= uStretch;
    vec3 q = vec3(d * uScale, seed);
    vec3 w = vec3(fbm(q * 0.45 + vec3(3.1, 1.7, 0.0), 5), fbm(q * 0.45 + vec3(7.9, 4.3, 2.0), 5), 0.0);
    vec3 r1 = q + uWarp * w;
    float wn = clamp(snoise(q * 0.5 + 13.0) * 0.5 + 0.5, 0.0, 1.0);
    // main veins
    float f1 = fbm(r1 * 0.8, 7);
    float d1 = abs(f1) / max(length(vec2(dFdx(f1), dFdy(f1))) / px, 1e-3);
    float wv = uVeinW * (0.1 + 0.9 * pow(wn, 1.7));
    // painterly ridge profile, capped in width (no blotches where the field lingers near zero),
    // plus a crisp core; runs fade in and out so the lines read as cracks, not outlines
    float seg1 = smoothstep(-0.55, 0.25, snoise(r1 * 1.2 + 77.0) + 0.3 * wn);
    float ridge1 = clamp(1.0 - abs(f1), 0.0, 1.0);
    float sharp = mix(18.0, 80.0, wn);
    float cap = 1.0 - smoothstep(uVeinW * 1.5, uVeinW * 4.0, d1);
    float core = 1.0 - smoothstep(wv * 0.5, wv + aa, d1);
    float v1 = clamp(pow(ridge1, sharp) * cap + core * 0.5, 0.0, 1.0) * seg1;
    float halo = pow(ridge1, sharp * 0.12) * (1.0 - smoothstep(0.02, 0.08, d1)) * seg1;
    float band = pow(ridge1, 3.5) * smoothstep(-0.4, 0.6, snoise(r1 * 0.7 + 17.0));
    // capillary network
    vec3 r2 = r1 * 2.6 + vec3(fbm(q * 1.3 + 11.0, 4), fbm(q * 1.3 + 23.0, 4), 0.0) * 0.7 + 31.0;
    float f2 = fbm(r2, 6);
    float d2 = abs(f2) / max(length(vec2(dFdx(f2), dFdy(f2))) / px, 1e-3);
    float w2 = uVeinW * 0.12 + px * 0.25;
    float v2 = (1.0 - smoothstep(w2 * 0.3, w2 + aa, d2)) * smoothstep(-0.35, 0.35, snoise(q * 0.55 + 40.0)) * smoothstep(-0.2, 0.5, snoise(r2 * 1.1 + 5.0));
    float f3 = fbm(r1 * 5.0 + 50.0, 5);
    float d3 = abs(f3) / max(length(vec2(dFdx(f3), dFdy(f3))) / px, 1e-3);
    float v3 = (1.0 - smoothstep(0.0, px * 0.6 + aa, d3)) * smoothstep(0.1, 0.7, snoise(q * 0.8 + 70.0)) * smoothstep(0.0, 0.6, snoise(r1 * 4.0 + 9.0)) * 0.6;
    float c = fbm(q * 0.4 + 60.0, 5) * 0.5 + 0.5;
    float grain = snoise(vec3(p * 420.0, seed + 3.0)) * 0.6 + snoise(vec3(p * 160.0, seed + 8.0)) * 0.4;
    col = mix(uBase, uBase2, smoothstep(0.3, 0.85, c) * uCloud);
    col *= 1.0 + grain * 0.018;
    vec3 vc = mix(uVein, uVein2, smoothstep(-0.2, 0.6, snoise(q * 0.6 + 90.0)));
    col = mix(col, mix(col, vc, 0.3), clamp(halo * uHalo + band * uBand, 0.0, 1.0) * uVeinAmt);
    col = mix(col, uFine, clamp(v2 + v3, 0.0, 1.0) * uFineAmt);
    // feathered parallel striations running with the veins (quartzites such as Taj Mahal)
    if (uStria > 0.0) {
      float flow = d.y * uScale * 7.0 + 1.6 * fbm(q * 0.55 + 5.0, 5) + 0.25 * fbm(q * 3.0 + 9.0, 3);
      float stria = pow(0.5 + 0.5 * sin(flow * 6.2832), 5.0) * 0.7 + pow(0.5 + 0.5 * sin(flow * 6.2832 * 3.7 + 1.3), 9.0) * 0.4;
      float zone = smoothstep(0.42, 0.72, fbm(q * 0.45 + 33.0, 4) * 0.5 + 0.5);
      col = mix(col, mix(col, vc, 0.55), clamp(stria * zone * uStria, 0.0, 1.0));
      col = mix(col, uBase * 1.03, smoothstep(0.6, 0.85, fbm(q * 0.8 + 61.0, 4) * 0.5 + 0.5) * 0.35 * uStria);
    }
    col = mix(col, vc, v1 * uVeinAmt);
    h = grain * 0.000004 - v1 * 0.00002;
    r = uRough + (c - 0.5) * uRoughVar + v1 * 0.05 + grain * 0.02;
  #elif KIND == 1
    // travertine: layered bands with elongated pores
    vec3 q = vec3(p.x * uScale * 0.3, p.y * uScale * (0.6 + 3.4 * uStretch), seed);
    q.y += 0.7 * fbm(vec3(p * uScale * 0.6, seed + 3.0), 4);
    float band = fbm(q, 6) * 0.5 + 0.5;
    col = mix(uBase, uBase2, smoothstep(0.25, 0.8, band));
    float layer = smoothstep(0.6, 0.75, fbm(q * 1.7 + 9.0, 4) * 0.5 + 0.5);
    col = mix(col, uVein, layer * 0.55);
    col = mix(col, uVein2, smoothstep(0.7, 0.85, fbm(q * 0.9 + 21.0, 4) * 0.5 + 0.5) * 0.5);
    float pn = snoise(vec3(p.x * uScale * 9.0, p.y * uScale * (12.0 + 40.0 * uStretch), seed + 17.0));
    float zone = smoothstep(0.35, 0.65, fbm(vec3(p * uScale * 1.4, seed + 5.0), 3) * 0.5 + 0.5 + 0.15);
    float pore = smoothstep(0.6, 0.8, pn) * zone * (0.5 + 0.5 * smoothstep(-0.2, 0.6, snoise(vec3(p * uScale * 3.0, seed + 31.0))));
    col = mix(col, uFine, pore * 0.65);
    h = -pore * 0.0005 + fbm(vec3(p * 90.0, seed), 3) * 0.00003;
    r = uRough + pore * 0.12 + (band - 0.5) * uRoughVar;
  #elif KIND == 2
    // straight-grain veneer, grain runs along v (p.y)
    float warp = fbm(vec3(p.x * 2.2, p.y * 0.12, seed), 5);
    float rings = (p.x + warp * 0.03) * uScale;
    float s = fract(rings + 0.15 * snoise(vec3(p.x * 8.0, p.y * 0.4, seed + 2.0)));
    float late = smoothstep(0.5, 0.95, s) * (0.6 + 0.4 * snoise(vec3(rings * 0.3, p.y * 0.2, seed + 9.0)));
    float fig = fbm(vec3(p.x * 5.0, p.y * 0.5, seed + 4.0), 5) * 0.5 + 0.5;
    col = mix(uBase, uBase2, smoothstep(0.2, 0.85, fig));
    col = mix(col, uVein, clamp(late, 0.0, 1.0) * 0.6);
    float pores = smoothstep(0.55, 0.85, snoise(vec3(p.x * 700.0, p.y * 9.0, seed + 7.0)));
    col *= 1.0 - pores * 0.22;
    h = -pores * 0.00006;
    r = uRough + pores * 0.12 + late * 0.04 + (fig - 0.5) * uRoughVar;
  #elif KIND == 4
    // limestone: sandy ground with soft clouds, open pores at three sizes (uWarp scales them, uHalo sets how
    // many), dark specks and faint wavy stylolites
    vec3 q = vec3(p * uScale, seed);
    float c = fbm(q * 0.5, 5) * 0.5 + 0.5;
    float c2 = fbm(q * 3.0 + 7.0, 4) * 0.5 + 0.5;
    col = mix(uBase, uBase2, smoothstep(0.25, 0.85, c) * uCloud);
    col *= 1.0 + (c2 - 0.5) * 0.1;
    float g1 = snoise(vec3(p * 700.0, seed + 1.0));
    float g2 = snoise(vec3(p * 240.0, seed + 2.0));
    col *= 1.0 + g1 * 0.035 + g2 * 0.02;
    float zone = smoothstep(0.3, 0.75, fbm(vec3(p * 3.0, seed + 5.0), 3) * 0.5 + 0.5);
    float thr = 0.78 - 0.12 * uHalo;
    float pa = snoise(vec3(p * 95.0 * uWarp, seed + 11.0));
    float pb = snoise(vec3(p * 230.0 * uWarp, seed + 13.0));
    float pc = snoise(vec3(p * 480.0 * uWarp, seed + 17.0));
    float pore = smoothstep(thr, thr + 0.12, pa) * (0.3 + 0.7 * zone)
               + smoothstep(thr - 0.04, thr + 0.1, pb) * (0.45 + 0.55 * zone)
               + smoothstep(thr + 0.02, thr + 0.14, pc) * 0.7;
    pore = clamp(pore * uFineAmt, 0.0, 1.0);
    col = mix(col, uFine, pore * 0.85);
    float speck = smoothstep(0.8, 0.92, snoise(vec3(p * 300.0, seed + 21.0))) * smoothstep(0.2, 0.6, zone);
    col = mix(col, uVein2, speck * 0.5 * min(uFineAmt, 1.0));
    vec2 d = rot(uAngle) * p;
    d.x *= uStretch;
    float f = fbm(vec3(d * uScale * 1.2, seed + 30.0), 5);
    float dist = abs(f) / max(length(vec2(dFdx(f), dFdy(f))) / uTexel.x, 1e-3);
    float vein = (1.0 - smoothstep(uVeinW * 0.3, uVeinW + uTexel.x, dist)) * smoothstep(0.0, 0.5, snoise(vec3(p * uScale * 0.9, seed + 40.0)));
    col = mix(col, uVein, vein * uVeinAmt);
    h = -pore * 0.0006 + fbm(vec3(p * 50.0, seed + 3.0), 3) * 0.00006 + g1 * 0.000005;
    r = uRough + (c - 0.5) * uRoughVar + pore * 0.12;
  #else
    // lime plaster: soft clouds, fine trowel texture
    vec3 q = vec3(p * uScale, seed);
    float c = fbm(q * 0.6, 5) * 0.5 + 0.5;
    float c2 = fbm(q * 4.0 + 10.0, 4) * 0.5 + 0.5;
    col = mix(uBase, uBase2, smoothstep(0.3, 0.8, c) * uCloud) * (1.0 + (c2 - 0.5) * 0.035);
    h = fbm(vec3(p * 22.0, seed + 3.0), 4) * 0.0003 + fbm(vec3(p * 140.0, seed + 5.0), 3) * 0.00004;
    r = uRough + (c - 0.5) * uRoughVar;
  #endif
  }

  void fullSample(vec2 p, out vec3 col, out float h, out float r) {
    if (uTile.x > 0.0) {
      vec2 id = floor(p / uTile);
      vec2 l = p - id * uTile;
      float d = min(min(l.x, uTile.x - l.x), min(l.y, uTile.y - l.y));
      sampleMat(p + id * vec2(3.7, 5.3), uSeed + id.x * 7.31 + id.y * 13.17, col, h, r);
      float joint = 1.0 - smoothstep(uJoint * 0.5, uJoint * 0.5 + uTexel.x * 1.2, d);
      float bevel = 1.0 - smoothstep(uJoint * 0.5, uJoint * 0.5 + 0.0016, d);
      col = mix(col, uGrout, joint);
      h -= bevel * 0.0005 + joint * 0.0006;
      r = mix(r, 0.85, joint);
    } else {
      sampleMat(p, uSeed, col, h, r);
    }
    // fluted / reeded relief across p.x: the ribs run along p.y
    if (uFlute > 0.0) {
      float u = 2.0 * fract(p.x / uFlute) - 1.0;
      float prof = sqrt(max(0.0, 1.0 - u * u));
      h += prof * uFlute * 0.32;
      col *= 0.9 + 0.1 * prof;
    }
  }

  void main() {
    vec2 p = vUv * uSize;
    vec3 col; float h; float r;
    fullSample(p, col, h, r);
  #if MODE == 0
    gl_FragColor = vec4(max(col, vec3(0.0)), 1.0);
  #elif MODE == 1
    gl_FragColor = vec4(h * 1000.0, 0.0, 0.0, 1.0);
  #else
    gl_FragColor = vec4(1.0, clamp(r, 0.03, 1.0), 0.0, 1.0);
  #endif
  }
`;

const NORMAL_FRAG = /* glsl */`
  varying vec2 vUv;
  uniform sampler2D tHeight;
  uniform vec2 uTexelUv;
  uniform vec2 uTexel;
  uniform float uBump;
  void main() {
    float hl = texture2D(tHeight, vUv - vec2(uTexelUv.x, 0.0)).r;
    float hr = texture2D(tHeight, vUv + vec2(uTexelUv.x, 0.0)).r;
    float hd = texture2D(tHeight, vUv - vec2(0.0, uTexelUv.y)).r;
    float hu = texture2D(tHeight, vUv + vec2(0.0, uTexelUv.y)).r;
    vec3 n = normalize(vec3(-(hr - hl) / 1000.0 / (2.0 * uTexel.x) * uBump, -(hu - hd) / 1000.0 / (2.0 * uTexel.y) * uBump, 1.0));
    gl_FragColor = vec4(n * 0.5 + 0.5, 1.0);
  }
`;

function bakeMaterial(kind, mode) {
  const key = kind + ':' + mode;
  if (!bakeMats.has(key)) {
    bakeMats.set(key, new THREE.ShaderMaterial({
      defines: { KIND: kind, MODE: mode },
      uniforms: {
        uSize: { value: new THREE.Vector2() }, uTexel: { value: new THREE.Vector2() }, uSeed: { value: 0 },
        uBase: { value: new THREE.Color() }, uBase2: { value: new THREE.Color() }, uVein: { value: new THREE.Color() },
        uVein2: { value: new THREE.Color() }, uFine: { value: new THREE.Color() }, uGrout: { value: new THREE.Color() },
        uScale: { value: 1 }, uWarp: { value: 1 }, uVeinW: { value: 0.03 }, uVeinAmt: { value: 1 }, uFineAmt: { value: 0.5 },
        uCloud: { value: 0.5 }, uHalo: { value: 1 }, uBand: { value: 0 }, uStria: { value: 0 }, uAngle: { value: 0 }, uStretch: { value: 1 }, uRough: { value: 0.3 }, uRoughVar: { value: 0.05 },
        uFlute: { value: 0 }, uTile: { value: new THREE.Vector2() }, uJoint: { value: 0.002 },
      },
      vertexShader: QUAD_VERT, fragmentShader: BAKE_FRAG, depthTest: false, depthWrite: false,
    }));
  }

}

  vertexShader: QUAD_VERT, fragmentShader: NORMAL_FRAG, depthTest: false, depthWrite: false,
});

// draws `material` into `rt` in tiles so no single draw call runs long enough to upset the GPU watchdog
async function drawTiled(material, rt, tile = 512) {
  bakeQuad.material = material;
  const { width, height } = rt;
  rt.scissorTest = true;
  for (let y = 0; y < height; y += tile) {
    for (let x = 0; x < width; x += tile) {
      rt.scissor.set(x, y, Math.min(tile, width - x), Math.min(tile, height - y));
      renderer.setRenderTarget(rt);
      renderer.render(bakeScene, bakeCam);
    }
    await pause();
  }
  rt.scissorTest = false;
  rt.scissor.set(0, 0, width, height);
  renderer.setRenderTarget(null);
}

    mesh.castShadow = shadow && !NO_AO.has(mat);
    mesh.receiveShadow = true;

    parent.add(mesh);

// rounded rectangle contour (CCW), radii per corner [x0y0, x1y0, x1y1, x0y1]
function rrect(x0, x1, y0, y1, rad, n = 8) {
  const pts = [];
  const corner = (cx, cy, r, a0) => {
    for (let i = 0; i < n; i++) {
      const a = a0 + (i / (n - 1)) * Math.PI / 2;
      pts.push([cx + Math.cos(a) * r, cy + Math.sin(a) * r]);
    }
  };
  corner(x1 - rad[1], y0 + rad[1], rad[1], -Math.PI / 2);
  corner(x1 - rad[2], y1 - rad[2], rad[2], 0);
  corner(x0 + rad[3], y1 - rad[3], rad[3], Math.PI / 2);
  corner(x0 + rad[0], y0 + rad[0], rad[0], Math.PI);

}
// loft through rings of equal point count; closes with a fan at the last ring when `cap`
function loft(rings, cap = false) {
  const pos = [], idx = [];
  const n = rings[0].pts.length;
  for (const r of rings) for (const p of r.pts) pos.push(p[0], p[1], r.z);
  for (let i = 0; i < rings.length - 1; i++) {
    for (let j = 0; j < n; j++) {
      const a = i * n + j, b = i * n + (j + 1) % n, c = (i + 1) * n + (j + 1) % n, d = (i + 1) * n + j;
      idx.push(a, b, c, a, c, d);
    }
  }
  if (cap) {
    const last = rings[rings.length - 1];
    const cx = last.pts.reduce((s, p) => s + p[0], 0) / n, cy = last.pts.reduce((s, p) => s + p[1], 0) / n;
    const ci = pos.length / 3;
    pos.push(cx, cy, last.z);
    const base = (rings.length - 1) * n;
    for (let j = 0; j < n; j++) idx.push(base + j, base + (j + 1) % n, ci);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

// world-metre UVs per triangle, projected along the triangle's dominant axis (like box())
function projectUV(geo) {
  const g = geo.index ? geo.toNonIndexed() : geo;
  const P = g.attributes.position, uv = new Float32Array(P.count * 2);
  const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
  for (let i = 0; i < P.count; i += 3) {
    a.fromBufferAttribute(P, i); b.fromBufferAttribute(P, i + 1); c.fromBufferAttribute(P, i + 2);
    const n = b.clone().sub(a).cross(c.clone().sub(a));
    const ax = Math.abs(n.x) >= Math.abs(n.y) && Math.abs(n.x) >= Math.abs(n.z) ? 0 : Math.abs(n.y) >= Math.abs(n.z) ? 1 : 2;
    for (let k = 0; k < 3; k++) {
      const v = [a, b, c][k];
      const [u, w] = ax === 0 ? [v.y, v.z] : ax === 1 ? [v.x, v.z] : [v.x, v.y];
      uv[(i + k) * 2] = u; uv[(i + k) * 2 + 1] = w;
    }
  }
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  return g;
}

// ---------------------------------------------------------------- SketchUp parts (toilet, tap)
async function loadSkp() {
  const meta = JSON.parse($('meta').textContent);
  const b64 = $('geom').textContent.trim();
  const res = await fetch('data:application/octet-stream;base64,' + b64);
  const buf = await new Response(res.body.pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  return { meta, buf };
}
function skpGeometry({ meta, buf }, defIndex, matrix) {
  const geos = [];
  const walk = (di, m) => {
    const d = meta.defs[di];
    for (const p of d.parts) {
      const P = new Float32Array(buf, p.v, p.nv * 3);
      const N = new Int8Array(buf, p.n, p.nv * 3);
      const I = p.i16 ? new Uint16Array(buf, p.i, p.ni) : new Uint32Array(buf, p.i, p.ni);
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(Float32Array.from(P), 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(Float32Array.from(N, (x) => x / 127), 3));
      g.setIndex(Array.from(I));
      g.applyMatrix4(m);
      if (m.determinant() < 0) {
        const ix = g.index.array;
        for (let k = 0; k < ix.length; k += 3) { const t = ix[k + 1]; ix[k + 1] = ix[k + 2]; ix[k + 2] = t; }
      }
      geos.push(g);
    }
    for (const c of d.ch) walk(c[0], m.clone().multiply(new THREE.Matrix4().fromArray(c, 2)));
  };
  walk(defIndex, matrix);
  return geos;
}
function findInstance(skp, test) {
  const root = skp.meta.defs[skp.meta.root];
  for (const c of root.ch) if (test(skp.meta.defs[c[0]], c[1] >= 0 ? skp.meta.materials[c[1]] : null)) return c;
  return null;
}

// one animation step for the door and the sash; true while something moved
function animateOpenings(dt) {
  let moved = false;
  if (DOOR.pivot && DOOR.t !== (DOOR.open ? 1 : 0)) {
    DOOR.t = THREE.MathUtils.clamp(DOOR.t + (DOOR.open ? dt : -dt) / 1.0, 0, 1);
    DOOR.pivot.rotation.z = Math.PI / 2 * (1 - DOOR.t * DOOR.t * (3 - 2 * DOOR.t));
    L.corridor.visible = DOOR.t > 0.02;      // a closed door keeps the hallway light out
    if (DOOR.t === 0 || DOOR.t === 1) envSoon();
    moved = true;
  }
  if (WINDOW.turnG) {
    const tg = WINDOW_MODES[WINDOW.mode], c = WINDOW.cur;
    let step = false;
    for (const k of ['turn', 'tilt', 'lever']) {
      const d = tg[k] - c[k];
      if (Math.abs(d) > 1e-5) { c[k] += Math.sign(d) * Math.min(Math.abs(d), dt / 0.9); step = true; }
    }
    if (step) {
      const e = (x) => x * x * (3 - 2 * x);
      WINDOW.turnG.rotation.z = e(c.turn) * THREE.MathUtils.degToRad(88);
      WINDOW.tiltG.rotation.x = e(c.tilt) * THREE.MathUtils.degToRad(4);
      WINDOW.leverG.rotation.y = -Math.PI * c.lever;
      if (c.turn === tg.turn && c.tilt === tg.tilt && c.lever === tg.lever) envSoon();
      moved = true;
    }
  }
  if (moved) renderer.shadowMap.needsUpdate = true;
  return moved;
}

// ---------------------------------------------------------------- exterior venetian blinds, switchable glass
// Retractable, tiltable outdoor blinds in the window's outer reveal: C80 aluminium slats in anthracite between
// side guide rails, a heavier bottom rail and ladder cords. Let down, the slats hang from the bottom rail up at
// their 72 mm pitch; the rest wait packed in a box hidden in the lintel. BLINDS.down: how far they are let down
// (0 retracted .. 1 to the sill), target: where they are travelling to; tilt: 0 open (horizontal) .. 1 closed
// (80 degrees, the outer edge down). The slats cast the real sun's shadows; blindLight() dims the light that
// has no shadows of its own (the sky through the window, the sun bounced off the mirror).
const SLAT = { w: 0.08, pitch: 0.072, t: 0.0045 };
const BLINDS = { down: 0, target: 0, tilt: 0.3, slats: null, rail: null, cords: [], cordX: [], n: 0, cx: 0 };
// switchable PDLC privacy film on the window glass (the master bathroom has it): powered it is clear, off milky
const PDLC = { frosted: false };
function buildBlinds() {
  const { x0, x1, y, head, sill } = BLIND, gw = 0.024, len = x1 - x0 - gw;
  const G = new THREE.Group();
  R.add(G);
  const part = (geo, shadow = true) => { const m = new THREE.Mesh(geo, M.blind); m.castShadow = shadow; m.receiveShadow = true; G.add(m); return m; };
  part(box(x0, x0 + gw, y - 0.03, y + 0.03, sill, head));                         // guide rails
  part(box(x1 - gw, x1, y - 0.03, y + 0.03, sill, head));
  // a slat: a crowned strip along x, its width across the reveal (y), turned about its length to tilt
  const g = new THREE.BoxGeometry(len, SLAT.w, SLAT.t, 1, 8, 1), P = g.attributes.position;
  for (let i = 0; i < P.count; i++) { const v = P.getY(i) / (SLAT.w / 2); P.setZ(i, P.getZ(i) + 0.006 * (1 - v * v)); }
  g.computeVertexNormals();

  Object.assign(BLINDS.slats, { castShadow: true, receiveShadow: true, frustumCulled: false });
  G.add(BLINDS.slats);

  for (const f of [0.12, 0.88]) {
    BLINDS.cordX.push(x0 + gw / 2 + len * f);
    BLINDS.cords.push(part(cyl(0.0015, 1, 'z', [0, 0, 0.5], 6), false));
  }

}
function updateBlinds() {
  const { y, head, sill } = BLIND, drop = BLINDS.down * (head - sill), bottom = head - drop, shown = drop > 0.02;
  const q = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -THREE.MathUtils.degToRad(80 * BLINDS.tilt));
  const m = new THREE.Matrix4(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  for (let i = 0; i < BLINDS.n; i++) {
    const z = bottom + 0.035 + i * SLAT.pitch;
    sc.setScalar(shown && z < head - 0.012 ? 1 : 0);
    BLINDS.slats.setMatrixAt(i, m.compose(p.set(BLINDS.cx, y, z), q, sc));
  }
  BLINDS.slats.instanceMatrix.needsUpdate = true;
  BLINDS.rail.visible = shown;
  BLINDS.rail.position.set(BLINDS.cx, y, bottom);
  BLINDS.cords.forEach((c, i) => { c.visible = shown; c.position.set(BLINDS.cordX[i], y, bottom); c.scale.z = Math.max(drop, 0.001); });

// let the blinds down (0..1) and tilt the slats (0..1); animated, they travel at about 0.45 of the drop a second
function setBlinds(down, tilt = BLINDS.tilt, animate = false) {
  BLINDS.target = down;
  BLINDS.tilt = tilt;

function blindLight() {

// sun position for Pt (49.0 N, 14.0 E). The window faces due east, so in SketchUp
// coordinates +y is east and +x is south. Hours are solar time; the clock shows CEST.
const LAT = THREE.MathUtils.degToRad(49.01), DAY_OF_YEAR = 172;      // 21 June
const CLOCK_OFFSET = 1.067;
let sunHour = 5.5, sunSU = new THREE.Vector3(0, 1, 0);
function solar(day, hour) {
  const decl = THREE.MathUtils.degToRad(23.44) * Math.sin((2 * Math.PI * (284 + day)) / 365);
  const h = THREE.MathUtils.degToRad(15 * (hour - 12));
  const alt = Math.asin(Math.sin(LAT) * Math.sin(decl) + Math.cos(LAT) * Math.cos(decl) * Math.cos(h));
  const az = Math.atan2(Math.sin(h), Math.cos(h) * Math.sin(LAT) - Math.tan(decl) * Math.cos(LAT)) + Math.PI;
  return { alt, az };
}
const toThree = (v) => new THREE.Vector3(v.x, v.z, -v.y);
function setSun(alt, az, day) {
  const E = Math.cos(alt) * Math.sin(az), N = Math.cos(alt) * Math.cos(az), U = Math.sin(alt);
  sunSU = new THREE.Vector3(-N, E, U);
  const dir = toThree(sunSU).normalize();
  sky.material.uniforms.sunPosition.value.copy(dir);
  const up = U > 0.005;
  const strength = THREE.MathUtils.clamp(U / 0.25, 0, 1);
  const sunCol = kelvin(3600 + 2400 * THREE.MathUtils.clamp(U / 0.5, 0, 1), 5800);
  const skyL = up ? 0.4 + 1.6 * THREE.MathUtils.smoothstep(U, 0, 0.35) : 0;
  L.sun.visible = L.bounce.visible = day && up;
  // the blinds' share of the light that has no shadows of its own, and the film when it is frosted
  const shade = blindLight(), frost = PDLC.frosted ? 1 : 0;
  L.sun.color.copy(sunCol); L.sun.intensity = 22 * strength * (1 - 0.85 * frost);
  L.bounce.color.copy(sunCol).multiply(M.mirror.color); L.bounce.intensity = 22 * strength * shade * (1 - 0.85 * frost);
  const c = L.sun.target.position;
  L.sun.position.copy(c).addScaledVector(dir, 12);
  const mdir = toThree(new THREE.Vector3(-sunSU.x, sunSU.y, sunSU.z)).normalize();
  L.bounce.position.copy(c).addScaledVector(mdir, 12);
  L.skyArea.visible = day && up;
  L.skyArea.color.copy(kelvin(6400, 5800));
  L.skyArea.intensity = 1.4 * skyL * shade * (1 + 3 * strength * frost);
  // outside: the photo as taken at dusk, brighter with the sun up, near-black and bluish at night
  const dusk = THREE.MathUtils.clamp((U + 0.12) / 0.11, 0.02, 1);
  if (up) OUT.view.color.setScalar(1.6 + 2.4 * strength);
  else OUT.view.color.setRGB(1.3 * dusk * (0.7 + 0.3 * dusk), 1.3 * dusk * (0.8 + 0.2 * dusk), 1.3 * dusk);
  // the pavement's sky light, in step with the photo: white by day, pale at dusk, dark at night
  M.pavement.emissive.copy(OUT.view.color).multiply(M.pavement.color).multiplyScalar(0.6);
  M.soffit.emissive.copy(OUT.view.color).multiply(M.soffit.color).multiplyScalar(0.3);   // the soffit sees the ground
  M.blind.emissive.copy(OUT.view.color).multiply(M.blind.color).multiplyScalar(0.5);
  // frosted, the film glows with the daylight behind it (the sky, and the sun when it is in the east)
  if (frost) M.windowGlass.emissive.copy(OUT.view.color).multiplyScalar(0.4).addScalar(strength * Math.max(0, sunSU.y)).multiplyScalar(shade);
  else M.windowGlass.emissive.setScalar(0);
  OUT.sun.visible = day && up;
  OUT.sun.position.copy(VIEW.centre).addScaledVector(dir, VIEW.r * 0.92);
  OUT.sun.material.color.copy(sunCol).multiplyScalar(400);
  const haze = up ? new THREE.Color(0xc4d0dc).multiplyScalar(0.6 + 1.2 * skyL) : new THREE.Color(U > -0.03 ? 0x2b3552 : 0x070a10).multiplyScalar(U > -0.03 ? 0.55 : 0.4);
  scene.fog.color.copy(haze);
  renderer.shadowMap.needsUpdate = true;
}
scene.fog = new THREE.FogExp2(0x000000, 0.00075);

// colours of light relative to a camera white balance (4300 K indoors at night, ~5800 K by day)
function kelvin(k, wb = 4300) {
  const c = kelvinRaw(k), w = kelvinRaw(wb);
  c.setRGB(c.r / w.r, c.g / w.g, c.b / w.b);
  return c.multiplyScalar(1 / Math.max(c.r, c.g, c.b));
}
function kelvinRaw(k) {
  const t = k / 100;
  let r, g, b;
  if (t <= 66) { r = 255; g = 99.4708025861 * Math.log(t) - 161.1195681661; b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307; }
  else { r = 329.698727446 * Math.pow(t - 60, -0.1332047592); g = 288.1221695283 * Math.pow(t - 60, -0.0755148492); b = 255; }
  const c = (v) => Math.min(255, Math.max(0, v)) / 255;
  return new THREE.Color().setRGB(c(r), c(g), c(b), THREE.SRGBColorSpace);
}

  evening: { label: 'Evening', down: 0.3, pend: 1, led: 1, art: 1, candle: 0.8, tint: '#ffe0bd', exposure: 0.85, sky: [-14, 340], bloom: 1.2 },
  bright: { label: 'Bright', down: 1, pend: 1, led: 0.7, art: 0.7, candle: 0, tint: '#fff0de', exposure: 0.7, sky: [-14, 340], bloom: 1.6 },

const BASE = { down: 6, pend: 1.6, led: 20, downLens: 30, globe: 1.6, strip: 7, haloLight: 10, art: 14, candle: 0.12, flame: 6 };

  const clear = 0.35 + 0.65 * Math.max(glass.r, glass.g, glass.b);      // smoked glass lets less through

const cubeRT = new THREE.WebGLCubeRenderTarget(256, { type: THREE.HalfFloatType, generateMipmaps: false });
const cubeCam = new THREE.CubeCamera(0.03, 120, cubeRT);   // far enough to take in the photo outside
cubeCam.position.copy(BP.bpProbe.value);
scene.add(cubeCam);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
function captureEnv(passes = 2) {
  const saved = reflectors.map((r) => r.uniforms.planarOn.value);
  for (const r of reflectors) r.uniforms.planarOn.value = 0;
  const ceilingWas = groups.ceiling.visible;
  groups.ceiling.visible = groups.pendants.visible = true;
  // three r170's transmission pass resets the active cube face, so glass would send every
  // face of the capture into face 0; glass is left out of the environment instead
  const glass = [];
  scene.traverse((o) => { if (o.isMesh && o.visible && o.material.transmission > 0) { glass.push(o); o.visible = false; } });
  for (let i = 0; i < passes; i++) {
    cubeCam.update(renderer, scene);
    const next = pmrem.fromCubemap(cubeRT.texture);
    scene.environment = next.texture;
    if (envRT) envRT.dispose();
    envRT = next;
  }
  for (const o of glass) o.visible = true;
  groups.ceiling.visible = groups.pendants.visible = ceilingWas;
  reflectors.forEach((r, i) => { r.uniforms.planarOn.value = saved[i]; });
}

  { key: 'wc', label: 'WC', pos: [54.35, 14.78, 1.55], tgt: [55.94, 15.2, 0.95], fov: 78 },
  { key: 'art', label: 'Print', pos: [54.55, 15.14, 1.55], tgt: [55.94, 15.14, 1.65], fov: 62 },
  { key: 'plan', label: 'Plan', pos: [54.885, 15.02, 8.6], tgt: [54.885, 15.14, 0.0], fov: 20, plan: true },
];
let current = VIEWS[0], tween = null;
const fovFor = (fov) => {
  const a = camera.aspect;
  if (a >= 1.25) return fov;
  return Math.min(100, THREE.MathUtils.radToDeg(2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(fov) / 2) * 1.25 / a)));
};
// stand where the sunlight bounced off the mirror reaches the eye, looking at the lit part of the mirror
function sunGlintView() {
  const s = sunSU, xm = MIRROR.x;
  if (s.y <= 0.01 || s.z <= 0) return null;
  // the window, and under the canopy's front edge
  const apertures = [[Y1, DOOR_N[0], DOOR_N[1], 0, H], [WIN.y, WIN.x0, WIN.x1, WIN.z0, WIN.z1], [5.562 + CANOPY.d, -1e9, 1e9, -1e9, WIN_TOP]];
  const acc = new THREE.Vector3();
  let n = 0;
  for (let i = 0; i <= 24; i++) for (let j = 0; j <= 16; j++) {
    const y = MIRROR.y0 + ((MIRROR.y1 - MIRROR.y0) * i) / 24, z = MIRROR.z0 + ((H - 0.002 - MIRROR.z0) * j) / 16;
    const lit = apertures.every(([yp, x0, x1, z0, z1]) => {
      const t = (yp - y) / s.y, x = xm + s.x * t, zz = z + s.z * t;
      return x >= x0 && x <= x1 && zz >= z0 && zz <= z1;

  }
  if (!n) return null;
  const m = acc.multiplyScalar(1 / n);

  let t = 2.2;
  if (r.y < 0) t = Math.min(t, (m.y - Y0 - 0.3) / -r.y);
  if (r.x < 0) t = Math.min(t, (xm - PRE - 0.4) / -r.x);
  if (r.z < 0) t = Math.min(t, (m.z - 0.9) / -r.z);

}
function goTo(view, instant = false) {
  if (view.sun) view = { ...view, ...(sunGlintView() || {}) };
  current = view;
  const toPos = SU(...view.pos), toT = SU(...view.tgt);
  document.querySelectorAll('#views button').forEach((b) => b.classList.toggle('on', b.dataset.key === view.key));
  if (instant) {
    camera.position.copy(toPos); controls.target.copy(toT); camera.fov = fovFor(view.fov); camera.updateProjectionMatrix(); controls.update();
    dirty = true;
    return;
  }

}
function clampCamera() {
  const p = camera.position;
  if (p.y > H - 0.02 && (current.plan || tween)) return;          // only the plan view looks in from above
  let x = p.x, y = -p.z, z = p.y;
  z = THREE.MathUtils.clamp(z, 0.25, H - 0.08);
  const inDoor = DOOR.t > 0.5 && x > DOOR_S[0] + 0.07 && x < DOOR_S[1] - 0.07;
  y = THREE.MathUtils.clamp(y, inDoor ? 13.5 : Y0 + 0.08, Y1 - 0.08);
  x = THREE.MathUtils.clamp(x, y < Y0 ? DOOR_S[0] + 0.07 : X0 + 0.08, y < Y0 ? DOOR_S[1] - 0.07 : X1 - 0.08);
  if (x < ST.front + 0.06 && z < 1.12) x = ST.front + 0.06;               // the basin
  if (x > WC.front - 0.55 && z < 0.62) x = WC.front - 0.55;               // the WC
  if (x > WC.front - 0.06 && z < WC.top + 0.05) x = WC.front - 0.06;      // its ledge
  p.set(x, z, -y);
  const t = controls.target;
  t.set(THREE.MathUtils.clamp(t.x, X0, X1), THREE.MathUtils.clamp(t.y, 0, H), THREE.MathUtils.clamp(t.z, -Y1, -13.5));
}

// ---------------------------------------------------------------- UI
let reflectionsOn = true, postOn = true, dirty = true, busy = false;
function setReflections(on) {
  reflectionsOn = on;
  for (const r of reflectors) r.uniforms.planarOn.value = on ? 1 : 0;
  dirty = true;
}
function buildUI() {
  $('views').innerHTML = VIEWS.map((v, i) => `<button data-key="${v.key}">${v.label}<kbd>${i + 1}</kbd></button>`).join('');
  $('views').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) pickView(VIEWS.find((v) => v.key === b.dataset.key));
  });
  const seg = (el, items, onPick, active) => {
    el.innerHTML = Object.entries(items).map(([k, v]) => `<button data-key="${k}" class="${k === active ? 'on' : ''}">${v.label}</button>`).join('');
    el.addEventListener('click', async (e) => {
      const b = e.target.closest('button');
      if (!b || busy || b.classList.contains('on')) return;
      el.querySelectorAll('button').forEach((x) => x.classList.toggle('on', x === b));
      await onPick(b.dataset.key);
    });
  };
  seg($('palettes'), PALETTES, (k) => withBusy(async () => { await applyPalette(k); captureEnv(); }), paletteKey);
  seg($('moods'), MOODS, (k) => setMood(k), moodKey);
  let envTimer = 0;
  $('sun').addEventListener('input', (e) => {
    setSunHour(parseFloat(e.target.value));
    dirty = true;
    clearTimeout(envTimer);
    envTimer = setTimeout(() => { captureEnv(); dirty = true; }, 120);
  });
  $('opts').addEventListener('click', () => {
    const open = $('side').classList.toggle('open');
    $('opts').setAttribute('aria-expanded', String(open));
  });
  $('t-refl').addEventListener('click', (e) => { e.currentTarget.classList.toggle('on'); setReflections(e.currentTarget.classList.contains('on')); });
  $('t-door').addEventListener('click', () => setDoor(!DOOR.open));
  $('t-ao').addEventListener('click', (e) => { e.currentTarget.classList.toggle('on'); postOn = e.currentTarget.classList.contains('on'); gtao.enabled = bloom.enabled = postOn; dirty = true; });
  window.addEventListener('keydown', (e) => {
    if (e.target.closest && e.target.closest('input, textarea')) return;
    if (e.key === 'p' || e.key === 'P') { saveImage(); return; }
    if ((e.key === 's' || e.key === 'S') && !busy) {
      const k = Object.keys(PALETTES), n = k[(k.indexOf(paletteKey) + 1) % k.length];
      document.querySelectorAll('#palettes button').forEach((b) => b.classList.toggle('on', b.dataset.key === n));
      withBusy(async () => { await applyPalette(n); captureEnv(); });
      return;
    }
    if (e.key === 'd' || e.key === 'D') { setDoor(!DOOR.open); return; }
    const i = parseInt(e.key, 10);
    if (i >= 1 && i <= VIEWS.length) pickView(VIEWS[i - 1]);
  });
  renderer.domElement.addEventListener('dblclick', (e) => {
    const ray = new THREE.Raycaster();
    ray.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1), camera);
    const shown = (o) => { for (; o; o = o.parent) if (!o.visible) return false; return true; };
    const hit = ray.intersectObjects(R.children, true).find((h) => shown(h.object) && !h.object.userData.occluder && h.object.material !== M.glass);
    if (!hit) return;
    const toT = hit.point.clone();
    const toPos = camera.position.clone().sub(controls.target).setLength(Math.min(1.2, camera.position.distanceTo(hit.point))).add(toT);
    tween = { t: 0, fromPos: camera.position.clone(), toPos, fromT: controls.target.clone(), toT, fromFov: camera.fov, toFov: camera.fov };
  });
  controls.addEventListener('change', () => { dirty = true; });
}
let moodKey = 'intimate';
async function setMood(k) {
  document.querySelectorAll('#moods button').forEach((b) => b.classList.toggle('on', b.dataset.key === k));
  await withBusy(async () => { moodKey = k; applyMood(k); captureEnv(); });
}
async function pickView(view) {
  if (view.sun && moodKey !== 'day') { if (busy) return; await setMood('day'); }
  if (view.sun && !sunGlintView()) {
    // the sun only reaches the mirror on early summer mornings: go to the nearest such moment (5.5 h first)
    const hours = [];
    for (let h = 4.25; h <= 9; h += 0.25) hours.push(h);
    hours.sort((x, y) => Math.abs(x - 5.5) - Math.abs(y - 5.5));
    let pick = 5.5;
    for (const h of hours) {
      const { alt, az } = solar(DAY_OF_YEAR, h);
      setSun(alt, az, true);
      if (sunGlintView()) { pick = h; break; }
    }
    $('sun').value = pick;
    setSunHour(pick);
    captureEnv();
  }
  goTo(view);
}
async function withBusy(fn) {
  busy = true;
  $('busy').classList.add('show');
  await pause(); await pause();
  try { await fn(); } finally { busy = false; $('busy').classList.remove('show'); dirty = true; }
}

// Renders the current view sharper than on screen (long side up to ~2560 px; screen resolution on touch
// devices to spare their memory) and returns it as a PNG blob. The page UI is HTML, so it is not in the image.
async function captureImage() {
  const w = innerWidth, h = innerHeight;
  const k = matchMedia('(pointer: coarse)').matches ? DPR : Math.max(DPR, Math.min(2, 2560 / Math.max(w, h)));
  const scale = (s) => {
    renderer.setPixelRatio(s);
    composer.setPixelRatio(s);
    renderer.setSize(w, h);
    composer.setSize(w, h);
    mirrorRefl.setSize(w * s, h * s);
    floorRefl.setSize(w * s, h * s);
  };
  try {
    scale(k);
    renderFrame();
    // toBlob copies the drawing buffer synchronously, before the browser presents and clears it
    return await new Promise((resolve) => renderer.domElement.toBlob(resolve, 'image/png'));
  } finally {
    scale(DPR);
    resize();
  }
}
let saving = false;
async function saveImage() {
  if (saving || busy) return;
  saving = true;
  const note = $('busy'), text = note.textContent;
  note.textContent = 'Saving image…';
  note.classList.add('show');
  await pause(); await pause();
  try {
    const blob = await captureImage();
    if (!blob) throw new Error('the browser returned no image');
    const d = new Date(), two = (n) => String(n).padStart(2, '0');
    const stamp = `${d.getFullYear()}-${two(d.getMonth() + 1)}-${two(d.getDate())} ${two(d.getHours())}-${two(d.getMinutes())}-${two(d.getSeconds())}`;
    const a = document.createElement('a');
    a.download = `Powder room - ${PALETTES[paletteKey].label}, ${MOODS[moodKey].label} - ${stamp}.png`;
    a.href = URL.createObjectURL(blob);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    note.textContent = 'Image saved';
  } catch (err) {
    console.error(err);
    note.textContent = 'Could not save the image';
  }
  setTimeout(() => { note.classList.remove('show'); note.textContent = text; saving = false; }, 1200);
}

function resize() {
  const w = innerWidth, h = innerHeight;
  camera.aspect = w / h;
  if (!tween) camera.fov = fovFor(current.fov);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  mirrorRefl.setSize(w * DPR, h * DPR);
  floorRefl.setSize(w * DPR, h * DPR);
  dirty = true;
}
window.addEventListener('resize', resize);

// ---------------------------------------------------------------- render loop
const clock = new THREE.Clock();
function renderFrame() {
  const above = camera.position.y > H - 0.02;
  groups.ceiling.visible = !above;
  groups.pendants.visible = !above;
  OUT.outside.visible = OUT.canopy.visible = sky.visible = !above;
  if (reflectionsOn) {
    floorRefl.update(renderer, scene, camera, [mirrorRefl]);
    if (!above) mirrorRefl.update(renderer, scene, camera, [floorRefl]);

}
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.1);
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 1.1);
    const k = tween.t < 0.5 ? 4 * tween.t ** 3 : 1 - Math.pow(-2 * tween.t + 2, 3) / 2;
    camera.position.lerpVectors(tween.fromPos, tween.toPos, k);
    controls.target.lerpVectors(tween.fromT, tween.toT, k);
    camera.fov = tween.fromFov + (tween.toFov - tween.fromFov) * k;
    camera.updateProjectionMatrix();
    if (tween.t >= 1) tween = null;
    dirty = true;
  }
  if (controls.update()) dirty = true;
  if (animateOpenings(dt)) dirty = true;
  if (hampers.length && HAMPER.t !== (HAMPER.open ? 1 : 0)) {
    HAMPER.t = THREE.MathUtils.clamp(HAMPER.t + (HAMPER.open ? dt : -dt) / 0.7, 0, 1);
    for (const h of hampers) h.rotation.y = HAMPER.max * HAMPER.t * HAMPER.t * (3 - 2 * HAMPER.t);
    renderer.shadowMap.needsUpdate = true;
    dirty = true;
  }

    const d = BLINDS.target - BLINDS.down;
    BLINDS.down += Math.sign(d) * Math.min(Math.abs(d), dt * 0.45);
    updateBlinds();
    if (BLINDS.down === BLINDS.target) { refreshSun(); envSoon(); }
  }
  if (!dirty) return;
  dirty = false;
  if (!tween) clampCamera();

}

// ---------------------------------------------------------------- start
try {
  setStatus('Reading the SketchUp model…');
  const skp = await loadSkp();
  setStatus('Building the room…');
  await pause();
  buildArchitecture();
  buildCeilingFixtures();
  buildFittings(skp);
  buildAccessories();
  flush(groups.room);
  buildMirrorFrame();
  flush(groups.framed);
  buildDoor();
  buildSash();
  buildRadiators();
  flush(groups.radiators);
  buildVanities();
  buildSurroundings(await loadView());
  buildLights();
  setStatus('Cutting stone and veneer…');
  await applyPalette(paletteKey);
  applyMood(moodKey);
  setStatus('Lighting the room…');
  await pause();
  renderer.shadowMap.needsUpdate = true;
  resize();
  captureEnv();
  setReflections(true);
  buildUI();
  goTo(VIEWS[0], true);
  renderFrame();
  window.__bath = { THREE, scene, camera, controls, renderer, M, E, L, VIEWS, VANITIES, applyVanity, setFlip, setDoor, setWindow, DOOR, WINDOW, STONES, texCache, bakeSet, captureImage, saveImage, setBlinds, BLINDS, setFilm, PDLC, setHamper, HAMPER, goTo, pickView, setMood, setSunHour, applyFloor, sunGlintView, R, SU, renderFrame, applyPalette, applyMood, captureEnv, gtao, bloom, setReflections, BP, cubeRT, reflectors,

} catch (err) {

  setStatus('Could not build the scene: ' + err.message);
}
